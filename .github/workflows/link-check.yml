name: Docs link check

# Validates links in Markdown docs so the public docs don't rot.
# Runs on PRs that touch docs, and weekly.

on:
  pull_request:
    paths:
      - "**/*.md"
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-mail
            --accept 200,206,429
            "**/*.md"
          fail: true
