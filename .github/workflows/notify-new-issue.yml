name: Notify maintainers on new issue

# Alerts the DIRE-OSI maintainers when a new issue is opened by
# auto-assigning it and posting an acknowledgement that @-mentions
# the team. Assignment and mentions trigger GitHub's native email
# notifications — no SMTP secrets required. Maintainers should also
# "Watch" this repository to receive all-activity notifications.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Assign and acknowledge
        uses: actions/github-script@v7
        with:
          script: |
            // Add or remove GitHub usernames here as the maintainer team grows.
            const maintainers = ['ghermay', 'griffvolkernlt'];
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                assignees: maintainers,
              });
            } catch (e) {
              core.warning(`Could not assign maintainers: ${e.message}`);
            }
            const mentions = maintainers.map(u => `@${u}`).join(' ');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `Thanks for opening this issue — the DIRE-OSI maintainers (${mentions}) have been notified and will review it.`,
                ``,
                `For open-ended questions and ideas, you can also use [Discussions](../../discussions).`,
                `DIRE is in beta, so response times may vary. Release notes are under [Releases](../../releases).`,
              ].join('\n'),
            });
