title: DIRE
description: >-
  Disease Incidence and Resource Estimator — open documentation for
  sub-national dengue and malaria forecasting and health-resource estimation.
url: https://dire-osi.github.io
baseurl: /platform

remote_theme: just-the-docs/just-the-docs@v0.11.2
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings
  - jekyll-default-layout

relative_links:
  enabled: true
  collections: true

color_scheme: dire
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Live dashboard":
    - "https://dire.impact.nltglobal.com"
  "Release notes":
    - "https://github.com/DIRE-OSI/platform/releases"
  "Feedback":
    - "https://github.com/DIRE-OSI/platform/issues/new?template=dashboard_feedback.yml"
  "GitHub":
    - "https://github.com/DIRE-OSI/platform"
aux_links_new_tab: true

callouts:
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: yellow
  caution:
    title: Caution
    color: red

gh_edit_link: true
gh_edit_link_text: "Suggest an edit on GitHub"
gh_edit_repository: "https://github.com/DIRE-OSI/platform"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "edit"

footer_content: >-
  DIRE is developed by UC San Diego (School of Global Policy and Strategy) and
  New Light Technologies, with Universidad Peruana Cayetano Heredia and UNICEF,
  funded by the Wellcome Trust. Code: Apache-2.0 · Documentation: CC BY 4.0 ·
  <a href="https://github.com/DIRE-OSI/platform/blob/main/DISCLAIMER.md">Disclaimer</a>

# Navigation: titles and order for pages that carry no front matter of their own
defaults:
  - scope: { path: "ABOUT.md" }
    values: { title: "About DIRE", nav_order: 3 }
  - scope: { path: "METHODS.md" }
    values: { title: "Methods", nav_order: 4 }
  - scope: { path: "RESEARCH_BASIS.md" }
    values: { title: "Research basis", nav_order: 5 }
  - scope: { path: "data-sources/README.md" }
    values: { title: "Data sources", nav_order: 6, has_children: true, permalink: "/data-sources/" }
  - scope: { path: "data-sources/nasa-earthdata.md" }
    values: { title: "NASA Earthdata", nav_order: 1, parent: "Data sources" }
  - scope: { path: "data-sources/copernicus-cds.md" }
    values: { title: "Copernicus CDS", nav_order: 2, parent: "Data sources" }
  - scope: { path: "data-sources/datasus-sinan.md" }
    values: { title: "Brazil DATASUS / SINAN", nav_order: 3, parent: "Data sources" }
  - scope: { path: "data-sources/peru-minsa.md" }
    values: { title: "Peru MINSA / CDC Perú", nav_order: 4, parent: "Data sources" }
  - scope: { path: "DATA_DICTIONARY.md" }
    values: { title: "Data dictionary", nav_order: 7 }
  - scope: { path: "TEST_DATA.md" }
    values: { title: "Test data", nav_order: 8 }
  - scope: { path: "ROADMAP.md" }
    values: { title: "Roadmap", nav_order: 10 }
  - scope: { path: "TEAM.md" }
    values: { title: "Team & partners", nav_order: 11 }

exclude:
  - _site
